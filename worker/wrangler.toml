name = "myadeen-watch"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false    # no public web address: the Worker only runs on its schedule
preview_urls = false   # no preview links for uploaded versions either

[triggers]
crons = ["*/2 * * * *"]   # every 2 minutes

[[kv_namespaces]]
binding = "STATE"
id = "9b0aece74c6045d4a4722b5e00f1fd00"   # myadeen-watch-state

[observability]
enabled = true   # keep logs, viewable in the Cloudflare dashboard
