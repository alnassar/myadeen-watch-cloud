name: Watch Myadeen courses
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: watch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check courses
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py
      - name: Save state (and keep the schedule alive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          if ! git diff --quiet state.json || [ $(( $(date +%s) - last )) -gt 1728000 ]; then
            date -u +%FT%TZ > last_commit.txt
            git add state.json last_commit.txt
            git commit -m "Update course state"
            git push
          fi
